  # --- AI -------------------------------------------------------------------
  /ai/chat:
    post:
      tags: [AI]
      summary: Ask the tenant-scoped compliance assistant
      x-permission: AUDIT_READ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                history:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Assistant response
        '503':
          description: AI features are not configured
  /ai/documents/{id}/summary:
    get:
      tags: [AI]
      summary: Get stored AI summary for a document
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stored summary
  /ai/documents/{id}/suggestions:
    get:
      tags: [AI]
      summary: Get stored AI metadata suggestions for a document
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stored suggestions
  /ai/documents/{id}/summarize:
    post:
      tags: [AI]
      summary: Queue on-demand AI summarization
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
