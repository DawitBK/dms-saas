  /ai/documents/{id}/extract:
    post:
      tags: [AI]
      summary: Queue on-demand AI metadata extraction
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Extraction queued

  # --- Operations --------------------------------------------------------------
  /operations/health:
    get:
      tags: [Operations]
