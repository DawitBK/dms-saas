        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bundle item removed
  /bundles/{id}/compile:
    post:
      tags: [Bundles]
      summary: Compile bundle items into a first-class PDF document
      x-permission: DOCUMENT_UPLOAD
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bundle compiled

  # --- E-signing ------------------------------------------------------------
  /documents/{documentId}/signing:
    get:
      tags: [ESigning]
      summary: List signature requests for a document
      x-permission: SIGNING_READ
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature requests
    post:
      tags: [ESigning]
      summary: Create a signature request for a document
      x-permission: SIGNING_MANAGE
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Signature request created
  /signing/{requestId}:
    get:
      tags: [ESigning]
      summary: Get a signature request
      x-permission: SIGNING_READ
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature request detail
  /signing/requests:
    get:
      tags: [ESigning]
      summary: List signature requests (scope pending-me | sent-by-me | completed | all)
      description: scope=all is the tenant-wide read-only oversight list (document:read_all holders only; 403 otherwise) and accepts status and q filters.
      x-permission: SIGNING_READ
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [pending-me, sent-by-me, completed, all] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, sent, partially_signed, completed, voided, expired] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: skip, in: query, schema: { type: integer } }
        - { name: take, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Page of signature requests
  /signing/{requestId}/audit:
    get:
      tags: [ESigning]
      summary: Audit trail of one signature request (who, when, address, browser, action)
      description: Requester, SYSTEM_ADMIN, or audit:read / document:read_all holders only.
      x-permission: SIGNING_READ
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ordered audit entries
        '403':
          description: Not the requester or an oversight holder
  /signing/{requestId}/send:
    post:
      tags: [ESigning]
      summary: Send a draft signature request
      x-permission: SIGNING_MANAGE
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature request sent
  /signing/{requestId}/recipients/{recipientId}/view:
    get:
      tags: [ESigning]
      summary: Public signer view link that marks a recipient viewed
      security: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public signing context
  /signing/{requestId}/recipients/{recipientId}/sign:
    post:
      tags: [ESigning]
      summary: Internal recipient signs
      x-permission: SIGNING_MANAGE
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature recorded
  /signing/{requestId}/recipients/{recipientId}/sign/external:
    post:
      tags: [ESigning]
      summary: External recipient signs with access token
      security: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature recorded
  /signing/{requestId}/recipients/{recipientId}/decline:
    post:
      tags: [ESigning]
      summary: Internal recipient declines
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature declined
  /signing/{requestId}/recipients/{recipientId}/decline/external:
    post:
      tags: [ESigning]
      summary: External recipient declines with access token
      security: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature declined

  # --- Forms ----------------------------------------------------------------
  /forms/templates:
