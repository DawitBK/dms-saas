  # --- Org Units --------------------------------------------------------------
  /org-units:
    get:
      tags: [OrgUnits]
      summary: List organizational units
      x-permission: ORG_UNIT_READ
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Org unit list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgUnit'
    post:
      tags: [OrgUnits]
      summary: Create an organizational unit
      x-permission: ORG_UNIT_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, unitType]
              properties:
                code:
                  type: string
                  minLength: 2
                  maxLength: 30
                  pattern: '^[A-Z0-9-]+$'
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                unitType:
                  type: string
                  enum: [HQ, BRANCH, OUTLET, SISTER_COMPANY]
                parentUnitId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Org unit created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrgUnit'
        '409':
          description: Unit code already exists
        '422':
          description: Parent unit not found

  /org-units/{id}:
    patch:
      tags: [OrgUnits]
      summary: Update an organizational unit
      x-permission: ORG_UNIT_MANAGE
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                parentUnitId:
                  type: string
                  format: uuid
                  nullable: true
                isActive:
                  type: boolean
      responses:
        '200':
          description: Org unit updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrgUnit'
        '404':
          description: Organizational unit not found
        '422':
          description: Invalid parent unit

