openapi: 3.1.0
info:
  title: DMS API
  version: 1.0.0
  description: |
    Enterprise Document & Archive Management System API.
    All endpoints (except /auth/* and /health) require Bearer JWT authentication.
    The JWT must contain: user_id, role, tenant_id claims.

servers:
  - url: /api/v1
    description: Current version

tags:
  - name: Auth
    description: Authentication and session management
  - name: Documents
    description: Document lifecycle management
  - name: Signing
    description: Electronic and PKI digital signatures
  - name: Versions
    description: Document version management
  - name: Users
    description: User management
  - name: Departments
    description: Department management
  - name: DocumentTypes
    description: Document type configuration
  - name: Workflow
    description: Approval workflow engine
  - name: LegalHold
    description: Legal hold management
  - name: Retention
    description: Retention policy management
  - name: Audit
    description: Immutable audit log
  - name: Search
    description: Full-text and metadata search
  - name: Notifications
    description: User notifications
  - name: Operations
    description: System health and operations
  - name: Letters
    description: CAMS correspondence register and letter workflows
  - name: Bundles
    description: Document bundle stitching and compilation
  - name: Forms
    description: Form template and instance management
  - name: ESigning
    description: External and internal electronic signature requests
  - name: AI
    description: AI-assisted compliance and document enrichment
  - name: OrgUnits
    description: CAMS organizational units (HQ, branches, outlets, sister companies)
  - name: AccessRules
    description: Tenant-wide and document-type-wide access rules (ACL)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LetterId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        documentName:
          type: string
          description: System-generated name in format DEPT-DOCTYPE-YYYYMMDD-SEQ4
        title:
          type: string
        departmentId:
          type: string
          format: uuid
        documentTypeId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        organisationUnit:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, IN_REVIEW, ON_HOLD, REJECTED, APPROVED,
                 PENDING_SIGNATURE, SIGNING_DECLINED, SIGNED, ACTIVE, SUPERSEDED,
                 ARCHIVED, LEGAL_HOLD, DISPOSAL_PENDING, DISPOSED, PRESERVED, CANCELLED]
        securityClassification:
          type: string
          enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
        sensitivityLabel:
          type: string
        retentionClass:
          type: string
        isOnLegalHold:
          type: boolean
        currentVersion:
          type: string
        source:
          type: string
        ocrStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        versionNumber:
          type: string
        isMajorVersion:
          type: boolean
        storageKey:
          type: string
        storageBucket:
          type: string
        fileSize:
          type: string
          description: BigInt as string
        mimeType:
          type: string
        originalFilename:
          type: string
        sha256Hash:
          type: string
        authorId:
          type: string
          format: uuid
        changeSummary:
          type: string
        createdAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
        isMfaEnabled:
          type: boolean
        mustChangePassword:
          type: boolean

    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean

    DocumentType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        defaultRetentionClass:
          type: string
        requiresSignature:
          type: boolean
        isActive:
          type: boolean

    WorkflowTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflowInstanceId:
          type: string
          format: uuid
        stageName:
          type: string
        stageNumber:
          type: integer
        assignedToUserId:
          type: string
          format: uuid
        assignedToRole:
          type: string
        slaDeadlineAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, APPROVED, REJECTED, ESCALATED, CANCELLED]
        decision:
          type: string
          enum: [APPROVE, REJECT]
        decisionReason:
          type: string

    LegalHold:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseReference:
          type: string
        description:
          type: string
        custodianName:
          type: string
        legalBasis:
          type: string
        status:
          type: string
          enum: [ACTIVE, RELEASED]
        appliedAt:
          type: string
          format: date-time
        releasedAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: string
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sequenceNumber:
          type: string
          description: BigInt as string
        timestamp:
          type: string
          format: date-time
        eventType:
          type: string
        userId:
          type: string
          format: uuid
        userRole:
          type: string
        documentId:
          type: string
          format: uuid
        actionDetails:
          type: string
          description: JSON string
        isSuccess:
          type: boolean
        entryHash:
          type: string

    OrgUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        code:
          type: string
        name:
          type: string
        unitType:
          type: string
          enum: [HQ, BRANCH, OUTLET, SISTER_COMPANY]
        parentUnitId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccessRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        principalType:
          type: string
          enum: [user, role]
        principalId:
          type: string
        effect:
          type: string
          enum: [ALLOW, DENY]
        permission:
          type: string
        documentTypeId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        grantedById:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  # --- Health --------------------------------------------------------------
  /health:
    get:
      tags: [Operations]
      summary: Basic health check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # --- Auth --------------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        '201':
          description: User registered; OTP sent to email
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and activate account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: Account verified
        '401':
          description: Invalid OTP

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful; access token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  requiresMfa:
                    type: boolean
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-2fa:
    post:
      tags: [Auth]
      summary: Verify TOTP MFA code to complete login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, totpCode]
              properties:
                userId:
                  type: string
                totpCode:
                  type: string
      responses:
        '200':
          description: MFA verified; full access token issued
        '401':
          description: Invalid TOTP code

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using HTTP-only cookie
      security: []
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Refresh token expired or revoked

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke session and clear cookies
      responses:
        '204':
          description: Session revoked

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # --- Documents --------------------------------------------------------------
  /documents:
    get:
      tags: [Documents]
      summary: List documents (scoped by role and ACL)
      x-permission: DOCUMENT_READ
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: take
          in: query
          schema:
            type: integer
            default: 20
        - name: folderId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
                  total:
                    type: integer
                  skip:
                    type: integer
                  take:
                    type: integer
    post:
      tags: [Documents]
      summary: Upload a new document
      x-permission: DOCUMENT_UPLOAD
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, departmentCode, documentTypeCode, organisationUnit, securityClassification, retentionClass, source]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                departmentCode:
                  type: string
                documentTypeCode:
                  type: string
                organisationUnit:
                  type: string
                securityClassification:
                  type: string
                  enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
                retentionClass:
                  type: string
                source:
                  type: string
                  enum: [MANUAL_UPLOAD, SCANNER, EMAIL, API, CREATED_IN_SYSTEM, MIGRATION]
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '413':
          description: File exceeds quota limit
        '415':
          description: Unsupported file type
        '422':
          description: Validation error

  /documents/stats:
    get:
      tags: [Documents]
      summary: Dashboard statistics
      x-permission: DOCUMENT_READ
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  byStatus:
                    type: object
                    additionalProperties:
                      type: integer
                  recent:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'

  /documents/{id}:
    get:
      tags: [Documents]
      summary: Get document detail
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document with versions and workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Not found
    patch:
      tags: [Documents]
      summary: Update document status via state machine
      x-permission: DOCUMENT_UPLOAD
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toState]
              properties:
                toState:
                  type: string
      responses:
        '200':
          description: Status updated
        '409':
          description: Invalid state transition

  /documents/{id}/download:
    get:
      tags: [Documents]
      summary: Download document file
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '409':
          description: Integrity violation (file tampered)

  /documents/{id}/preview:
    get:
      tags: [Documents]
      summary: Preview thumbnail
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Preview image
        '415':
          description: Preview not supported

  /documents/{id}/versions:
    get:
      tags: [Versions]
      summary: List document versions
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentVersion'
    post:
      tags: [Versions]
      summary: Upload new version (requires document to be checked out)
      x-permission: DOCUMENT_UPLOAD
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                changeSummary:
                  type: string
                isMajor:
                  type: boolean
      responses:
        '201':
          description: Version created

  /documents/{id}/archive:
    post:
      tags: [Documents]
      summary: Archive document
      x-permission: DOCUMENT_ARCHIVE
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document archived

  /documents/{id}/checkout:
    post:
      tags: [Documents]
      summary: Check out document for editing
      x-permission: DOCUMENT_CHECKOUT
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Checked out
        '409':
          description: Already locked by another user

  /documents/{id}/checkin:
    post:
      tags: [Documents]
      summary: Check in (release lock on) document
      x-permission: DOCUMENT_CHECKOUT
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Checked in

  /documents/{id}/sign/request:
    post:
      tags: [Signing]
      summary: Request signature - transitions document to PENDING_SIGNATURE
      x-permission: SIGNING_MANAGE
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature requested
        '409':
          description: Invalid state for signing

  /documents/{id}/sign/execute:
    post:
      tags: [Signing]
      summary: Execute signing (ELECTRONIC or PKI_DIGITAL)
      x-permission: SIGNING_MANAGE
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signingType]
              properties:
                signingType:
                  type: string
                  enum: [ELECTRONIC, PKI_DIGITAL]
                consentAcknowledged:
                  type: boolean
                  description: Required for ELECTRONIC signing
      responses:
        '200':
          description: Document signed
        '422':
          description: Consent required for electronic signing

  /documents/{id}/sign/decline:
    post:
      tags: [Signing]
      summary: Decline signing with reason
      x-permission: SIGNING_MANAGE
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: Signing declined

  /documents/{id}/sign/verify:
    get:
      tags: [Signing]
      summary: Verify signature integrity
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  signatures:
                    type: array
                    items:
                      type: object
                      properties:
                        signatureId:
                          type: string
                        signingType:
                          type: string
                        status:
                          type: string
                        hashValid:
                          type: boolean
                        signedAt:
                          type: string
                          format: date-time

  # --- Users --------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      summary: List users
      x-permission: USER_MANAGE
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Create user
      x-permission: USER_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName]
              properties:
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user (own profile or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User

  # --- Departments --------------------------------------------------------------
  /departments:
    get:
      tags: [Departments]
      summary: List departments
      x-permission: DOCUMENT_READ
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
    post:
      tags: [Departments]
      summary: Create department
      x-permission: DEPARTMENT_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Created

  # --- Document Types --------------------------------------------------------------
  /document-types:
    get:
      tags: [DocumentTypes]
      summary: List document types
      x-permission: DOCUMENT_READ
      responses:
        '200':
          description: Types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentType'
    post:
      tags: [DocumentTypes]
      summary: Create document type
      x-permission: DOCTYPE_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, defaultRetentionClass]
              properties:
                code:
                  type: string
                name:
                  type: string
                defaultRetentionClass:
                  type: string
                requiresSignature:
                  type: boolean
      responses:
        '201':
          description: Created

  # --- Workflow --------------------------------------------------------------
  /workflow/definitions:
    get:
      tags: [Workflow]
      summary: List workflow definitions
      x-permission: WORKFLOW_MANAGE
      responses:
        '200':
          description: Definitions
    post:
      tags: [Workflow]
      summary: Create workflow definition
      x-permission: WORKFLOW_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version, definition]
              properties:
                name:
                  type: string
                version:
                  type: string
                documentTypeId:
                  type: string
                definition:
                  type: object
      responses:
        '201':
          description: Created

  /workflow/tasks/my-queue:
    get:
      tags: [Workflow]
      summary: Get tasks assigned to current user
      x-permission: WORKFLOW_TASK_DECIDE
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowTask'

  /workflow/tasks/{taskId}/decide:
    post:
      tags: [Workflow]
      summary: Submit approval decision
      x-permission: WORKFLOW_TASK_DECIDE
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
                reason:
                  type: string
      responses:
        '200':
          description: Decision recorded

  # --- Legal Hold --------------------------------------------------------------
