                orgUnitId:
                  type: string
                  format: uuid
                departmentId:
                  type: string
                  format: uuid
                subject:
                  type: string
                correspondent:
                  type: string
                scan:
                  type: string
                  format: binary
      responses:
        '201':
          description: Incoming letter registered
  /letters/{id}:
    get:
      tags: [Letters]
