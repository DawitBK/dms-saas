                      $ref: '#/components/schemas/AccessRule'
    post:
      tags: [AccessRules]
      summary: Create an access rule (tenant-wide or document-type-wide)
      x-permission: ACL_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalType, principalId, effect, permission]
              properties:
                principalType:
                  type: string
                  enum: [user, role]
                principalId:
                  type: string
                effect:
                  type: string
                  enum: [ALLOW, DENY]
                permission:
                  type: string
                documentTypeId:
                  type: string
