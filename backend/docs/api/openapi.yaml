          description: Missing or invalid verification parameters
  /letters:
    get:
      tags: [Letters]
      summary: List letters with register filters and pagination
      x-permission: LETTER_READ
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [OUTGOING, INCOMING]
        - name: status
          in: query
          schema:
            type: string
        - name: orgUnitId
          in: query
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          schema:
            type: integer
        - name: letterType
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: overdue
          in: query
          schema:
            type: boolean
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: take
          in: query
          schema:
            type: integer
            default: 50
