    post:
      tags: [Letters]
      summary: Acknowledge a dispatch
      x-permission: LETTER_DISPATCH
      parameters:
        - $ref: '#/components/parameters/LetterId'
        - name: dispatchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dispatch acknowledged
