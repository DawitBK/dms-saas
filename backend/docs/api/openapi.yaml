        '201':
          description: Template created
  /forms/templates/{id}:
    get:
      tags: [Forms]
      summary: Get form template detail
      x-permission: DOCUMENT_READ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
